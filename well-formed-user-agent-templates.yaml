placeholders:
    bot_name: '[A-Za-z][A-Za-z0-9_.-]*'
    version: '[0-9][A-Za-z0-9._~+-]*'
    info_url_or_email: '(?:https?://[^)\s]+|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)'
    windows_nt_version: '[0-9]+(?:\.[0-9]+)*'
    webkit_version: '[0-9]+(?:\.[0-9]+)*'
    chrome_version: '(?:100|[1-9][0-9]{2,})(?:\.[0-9]+)*'
    safari_version: '[0-9]+(?:\.[0-9]+)*'
    android_version: '[0-9]+(?:\.[0-9]+)*'
    gecko_version: '[0-9]+'
    macos_version: '[0-9]+(?:[._][0-9]+)*'
    edge_version: '(?:100|[1-9][0-9]{2,})(?:\.[0-9]+)*'
    firefox_version: '(?:100|[1-9][0-9]{2,})(?:\.[0-9]+)*'
    ios_version: '[0-9]+(?:_[0-9]+)*'
    mobile_build: '[A-Za-z0-9]+'
    android_device_token: '[^;)\r\n]+'
    samsung_browser_version: '[0-9]+(?:\.[0-9]+)*'
    android_build_id: '[^;)\s]+'
    facebook_iab_token: '\[(?:FB_IAB|FBAN)/(?:FB4A|FBIOS);(?:[A-Z_]+/[^;\]\r\n]*;)*[A-Z_]+/[^;\]\r\n]*;?\](?:[; ]FBNV/[0-9]+)?'
    instagram_android_token: 'Instagram [0-9]+(?:\.[0-9]+)* Android \([^)]+\)(?: NV/[0-9]+)?'
    chrome_ios_version: '[0-9]+(?:\.[0-9]+)*'
    google_product_name: 'Google(?:bot|Other)-(?:Image|Video)'
    android_app: '[A-Za-z][A-Za-z0-9_.-]*'

templates:
# Compatible bot tokens.
- 'Mozilla/5.0 (compatible; <bot_name>/<version>; +<info_url_or_email>)'
- 'Mozilla/5.0 AppleWebKit/<webkit_version> (KHTML, like Gecko; compatible; <bot_name>/<version>; +<info_url_or_email>)'
- 'Mozilla/5.0 AppleWebKit/<webkit_version> (KHTML, like Gecko; compatible; <bot_name>/<version>; +<info_url_or_email>) Chrome/<chrome_version> Safari/<safari_version>'
- 'Mozilla/5.0 (compatible; <bot_name>/<version>; +<info_url_or_email>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version>'
- 'WordPress/<version>; <info_url_or_email>'
- '<bot_name>/<version> (+<info_url_or_email>)'

# Browser-shaped bot tokens.
- 'Mozilla/5.0 (Windows NT <windows_nt_version>; Win64; x64) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version> (compatible; <bot_name>/<version>; +<info_url_or_email>)'
- 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Safari/<safari_version> (<bot_name>/<version>; +<info_url_or_email>)'
- 'Mozilla/5.0 (Windows NT <windows_nt_version>; Win64; x64) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'
- 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'
- 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'
- 'Mozilla/5.0 (Windows NT <windows_nt_version>; Win64; x64) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version> Edg/<edge_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'
- 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version> Edg/<edge_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'
- 'Mozilla/5.0 (iPhone; CPU iPhone OS <ios_version> like Mac OS X) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Mobile/<mobile_build> Safari/<safari_version> (compatible; <bot_name>/<version>; +<info_url_or_email>)'
- 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token> Build/<android_build_id>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Mobile Safari/<safari_version> (compatible; <bot_name>/<version>; +<info_url_or_email>)'
- 'Mozilla/5.0 (Windows NT <windows_nt_version>; Win64; x64; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'
- 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'
- 'Mozilla/5.0 (X11; Linux x86_64; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'
- 'Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version> (compatible; <bot_name>/<version> (+<info_url_or_email>))'

# Chromium desktop.
- 'Mozilla/5.0 (Windows NT <windows_nt_version>; Win64; x64) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version>'
- 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version>'
- 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version>'

# Edge desktop.
- 'Mozilla/5.0 (Windows NT <windows_nt_version>; Win64; x64) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version> Edg/<edge_version>'
- 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version> Edg/<edge_version>'

# Safari.
- 'Mozilla/5.0 (iPhone; CPU iPhone OS <ios_version> like Mac OS X) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Mobile/<mobile_build> Safari/<safari_version>'
- 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Safari/<safari_version>'
- 'Mozilla/5.0 (iPad; CPU OS <ios_version> like Mac OS X) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Mobile/<mobile_build> Safari/<safari_version>'

# Firefox.
- 'Mozilla/5.0 (Windows NT <windows_nt_version>; Win64; x64; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version>'
- 'Mozilla/5.0 (Android <android_version>; Mobile; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version>'
- 'Mozilla/5.0 (X11; Linux x86_64; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version>'
- 'Mozilla/5.0 (X11; Ubuntu; Linux x86_64; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version>'
- 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>; rv:<firefox_version>) Gecko/<gecko_version> Firefox/<firefox_version>'

# Android Chromium.
- 'Mozilla/5.0 (Linux; Android <android_version>; K) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Mobile Safari/<safari_version>'
- 'Mozilla/5.0 (Linux; Android <android_version>; K) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version>'
- 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token>) AppleWebKit/<webkit_version> (KHTML, like Gecko) SamsungBrowser/<samsung_browser_version> Chrome/<chrome_version> Mobile Safari/<safari_version>'

# Android WebView and app shells.
- 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token> Build/<android_build_id>; wv) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Chrome/<chrome_version> Mobile Safari/<safari_version>'
- 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token>; wv) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Chrome/<chrome_version> Mobile Safari/<safari_version>'
- 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token>; wv) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Chrome/<chrome_version> Mobile Safari/<safari_version> <android_app>/<version>'

# Social in-app browsers.
- 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token> Build/<android_build_id>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Chrome/<chrome_version> Mobile Safari/<safari_version> <facebook_iab_token>'
- 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token> Build/<android_build_id>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Chrome/<chrome_version> Safari/<safari_version> <facebook_iab_token>'
- 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token> Build/<android_build_id>; wv) AppleWebKit/<webkit_version> (KHTML, like Gecko) Version/<version> Chrome/<chrome_version> Mobile Safari/<safari_version> <instagram_android_token>'
- 'Mozilla/5.0 (iPhone; CPU iPhone OS <ios_version> like Mac OS X) AppleWebKit/<webkit_version> (KHTML, like Gecko) Mobile/<mobile_build> Safari/<safari_version> <facebook_iab_token>'

# iOS Chromium.
- 'Mozilla/5.0 (iPhone; CPU iPhone OS <ios_version> like Mac OS X) AppleWebKit/<webkit_version> (KHTML, like Gecko) CriOS/<chrome_ios_version> Mobile/<mobile_build> Safari/<safari_version>'

# Google media crawlers.
- '<google_product_name>/<version>'
- 'AdsBot-Google (+<info_url_or_email>)'

# Known not well-formed UA patterns.
silly-billy:
    adsbot_google_mobile_android: 'Mozilla/5.0 (Linux; Android <android_version>; <android_device_token> Build/<android_build_id>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Mobile Safari/<safari_version> (compatible; AdsBot-Google-Mobile; +<info_url_or_email>)'
    linux_chrome_inline_bot_name: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/<webkit_version> (KHTML, like Gecko; <bot_name>) Chrome/<chrome_version> Safari/<safari_version>'
    bytespider_android_versioned: 'Mozilla/5.0 (Linux; Android <android_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Mobile Safari/<safari_version> (compatible; Bytespider/<version>; <info_url_or_email>)'
    bytespider_android: 'Mozilla/5.0 (Linux; Android <android_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Mobile Safari/<safari_version> (compatible; Bytespider; +<info_url_or_email>)'
    bytespider_android_email: 'Mozilla/5.0 (Linux; Android <android_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Mobile Safari/<safari_version> (compatible; Bytespider; <info_url_or_email>)'
    openai_searchbot_chrome: 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version>; compatible; OAI-SearchBot/<version>; +<info_url_or_email>'
    openai_searchbot_chrome_robots_txt: 'Mozilla/5.0 (Macintosh; Intel Mac OS X <macos_version>) AppleWebKit/<webkit_version> (KHTML, like Gecko) Chrome/<chrome_version> Safari/<safari_version>; compatible; OAI-SearchBot/<version>; robots.txt; +<info_url_or_email>'
